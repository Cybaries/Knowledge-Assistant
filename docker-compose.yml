services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knowledge_assistant_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: ./backend
    container_name: knowledge_assistant_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
  
  ai_service:
    build:
      context: ./ai_service
    container_name: knowledge_assistant_ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env

  ollama:
    image: ollama/ollama
    container_name: knowledge_assistant_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  ollama_data: